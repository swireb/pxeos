name: Build Experimental

on:
  workflow_dispatch:
    inputs:
      publish_beta:
        type: boolean
        default: true
        required: false
        description: "更新beta标签（测试版本）"
      init_arm64:
        type: boolean
        default: true
        description: "Create arm64 Init"
      init_x64:
        type: boolean
        default: true
        description: "Create x64 Init"
      init_x86:
        type: boolean
        default: true
        description: "Create x86 Init"
      kernel_arm64:
        type: boolean
        default: true
        description: "Create arm64 kernel"
      kernel_x64:
        type: boolean
        default: true
        description: "Create x64 kernel"
      kernel_x86:
        type: boolean
        default: true
        description: "Create x86 kernel"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  input_checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Make sure at least one workflow input is selected
        env:
          INIT_ARM64: ${{ inputs.init_arm64 }}
          INIT_X64: ${{ inputs.init_x64 }}
          INIT_X86: ${{ inputs.init_x86 }}
          KERNEL_ARM64: ${{ inputs.kernel_arm64 }}
          KERNEL_X64: ${{ inputs.kernel_x64 }}
          KERNEL_X86: ${{ inputs.kernel_x86 }}
        run: |
          init_arm64="$INIT_ARM64"
          init_x64="$INIT_X64"
          init_x86="$INIT_X86"
          kernel_arm64="$KERNEL_ARM64"
          kernel_x64="$KERNEL_X64"
          kernel_x86="$KERNEL_X86"
          if [[ "$init_arm64" == "false" && "$init_x64" == "false" && "$init_x86" == "false" && "$kernel_arm64" == "false" && "$kernel_x64" == "false" && "$kernel_x86" == "false" ]]; then
            echo "No kernels or inits selected to build."
            exit 1
          fi

  download_filesystem_packages:
    needs: input_checks

    if: ${{ inputs.init_arm64 || inputs.init_x64 || inputs.init_x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Download all FS packages
        run: ./build.sh -i --fs-download-only

  build_kernel_arm64:
    needs: input_checks

    if: ${{ inputs.kernel_arm64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build arm64 kernel
        run: ./build.sh --install-dep -nka arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-arm64
          path: dist
          retention-days: 1

  build_kernel_x86:
    needs: input_checks

    if: ${{ inputs.kernel_x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x86 kernel
        run: ./build.sh --install-dep -nka x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x86
          path: dist
          retention-days: 1

  build_kernel_x64:
    needs: input_checks

    if: ${{ inputs.kernel_x64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x64 kernel
        run: ./build.sh --install-dep -nka x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x64
          path: dist
          retention-days: 1

  build_initrd_arm64:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.init_arm64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-arm64
          key: ccache-arm64
          restore-keys: |
            ccache-arm64

      - name: Build arm64 initrd
        run: ./build.sh --install-dep -nfa arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-arm64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-arm64
          path: fssourcearm64/buildrootarm64.log
          retention-days: 30

  build_initrd_x86:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.init_x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x86
          key: ccache-x86
          restore-keys: |
            ccache-x86

      - name: Build x86 initrd
        run: ./build.sh --install-dep -nfa x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x86
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x86
          path: fssourcex86/buildrootx86.log
          retention-days: 30

  build_initrd_x64:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.init_x64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x64
          key: ccache-x64
          restore-keys: |
            ccache-x64

      - name: Build x64 initrd
        run: ./build.sh --install-dep -nfa x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x64
          path: fssourcex64/buildrootx64.log
          retention-days: 30

  release:
    needs:
      [
        build_kernel_arm64,
        build_kernel_x86,
        build_kernel_x64,
        build_initrd_arm64,
        build_initrd_x86,
        build_initrd_x64,
      ]

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pxeos-beta-release
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-files-*
          merge-multiple: true
          path: distribution-files

      - name: Set release name variable
        run: |
          echo "RELEASE_NAME=Experimental release from $(date '+%Y-%m-%d')" >> $GITHUB_ENV

      - name: Set tag name variable
        run: |
          echo "TAG_NAME=EXP_$(date '+%Y%m%d')_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> $GITHUB_ENV

      - name: Get Linux Kernel version from build.sh
        run: |
          echo "LINUX_KERNEL_VER=$(cat build.sh | sed -n -e 's/^.*KERNEL_VERSION=//p' | cut -d\' -f 2)" >> $GITHUB_ENV

      - name: Get Buildroot version from build.sh
        run: |
          echo "BUILDROOT_VER=$(cat build.sh | sed -n -e 's/^.*BUILDROOT_VERSION=//p' | cut -d\' -f 2)" >> $GITHUB_ENV

      - name: Generate beta download manifest
        env:
          RELEASE_TAG: ${{ env.TAG_NAME }}
        run: |
          python3 scripts/generate-pxeos-manifest.py --input-dir distribution-files --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --download-channel beta --output distribution-files/pxeos-beta.json

      - name: Run sha256 checksum on all files
        run: |
          cd distribution-files
          sha256sum -c ./*.sha256
          if [[ $? -ne 0 ]]; then exit 1; fi

      - name: Create release body
        env:
          KERNEL_ARM64: ${{ inputs.kernel_arm64 }}
          KERNEL_X64: ${{ inputs.kernel_x64 }}
          KERNEL_X86: ${{ inputs.kernel_x86 }}
          INIT_ARM64: ${{ inputs.init_arm64 }}
          INIT_X64: ${{ inputs.init_x64 }}
          INIT_X86: ${{ inputs.init_x86 }}
        run: |
          release_body_text="WARNING! This is an experimental releases. Backup your previous kernels/inits before installing these.\n\n"
          # 
          if [[ "$KERNEL_ARM64" == "true" || "$KERNEL_X64" == "true" || "$KERNEL_X86" == "true" ]]; then
            release_body_text+="Linux kernel $LINUX_KERNEL_VER\n"
          fi
          # 
          if [[ "$INIT_ARM64" == "true" || "$INIT_X64" == "true" || "$INIT_X86" == "true" ]]; then
            release_body_text+="Buildroot $BUILDROOT_VER"
          fi
          # GH Actions way of making a multiline text environment variable
          {
            echo 'RELEASE_BODY_TEXT<<EOF'
            echo -e $release_body_text
            echo EOF
          } >> "$GITHUB_ENV"

      - name: Validate historical release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'Invalid historical release tag.' >&2; exit 1; }
          [[ "$TAG_NAME" != latest && "$TAG_NAME" != beta ]] || { echo 'Historical release tag collides with a channel alias.' >&2; exit 1; }
          bash scripts/check-release-tag.sh --repo "$GITHUB_REPOSITORY" --tag "$TAG_NAME"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY_TEXT }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            distribution-files/*

      - name: Publish beta download manifest
        if: ${{ inputs.publish_beta == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-channel.sh \
            --repo "$GITHUB_REPOSITORY" \
            --channel beta \
            --target "$GITHUB_SHA" \
            --manifest distribution-files/pxeos-beta.json \
            --resource-dir distribution-files
