name: Build Beta

on:
  workflow_dispatch:
    inputs:
      arm64:
        type: boolean
        default: true
        required: false
        description: "arm64"
      x64:
        type: boolean
        default: true
        required: false
        description: "x64"
      x86:
        type: boolean
        default: true
        required: false
        description: "x86"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  input_checks:
    runs-on: ubuntu-24.04

    steps:
      - name: Validate selected architectures
        env:
          ARM64: ${{ inputs.arm64 }}
          X64: ${{ inputs.x64 }}
          X86: ${{ inputs.x86 }}
        run: |
          if [[ "$ARM64" != "true" && "$X64" != "true" && "$X86" != "true" ]]; then
            echo "No architectures selected."
            exit 1
          fi

  download_filesystem_packages:
    needs: input_checks

    if: ${{ inputs.arm64 || inputs.x64 || inputs.x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Download all FS packages
        run: ./build.sh -i --fs-download-only

  build_kernel_arm64:
    needs: input_checks

    if: ${{ inputs.arm64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build arm64 kernel
        run: ./build.sh --install-dep -nka arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-arm64
          path: dist
          retention-days: 1

  build_kernel_x86:
    needs: input_checks

    if: ${{ inputs.x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x86 kernel
        run: ./build.sh --install-dep -nka x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x86
          path: dist
          retention-days: 1

  build_kernel_x64:
    needs: input_checks

    if: ${{ inputs.x64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x64 kernel
        run: ./build.sh --install-dep -nka x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x64
          path: dist
          retention-days: 1

  build_initrd_arm64:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.arm64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-arm64
          key: ccache-arm64
          restore-keys: |
            ccache-arm64

      - name: Build arm64 initrd
        run: ./build.sh --install-dep -nfa arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-arm64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-arm64
          path: fssourcearm64/buildrootarm64.log
          retention-days: 30

  build_initrd_x86:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.x86 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x86
          key: ccache-x86
          restore-keys: |
            ccache-x86

      - name: Build x86 initrd
        run: ./build.sh --install-dep -nfa x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x86
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x86
          path: fssourcex86/buildrootx86.log
          retention-days: 30

  build_initrd_x64:
    needs: [input_checks, download_filesystem_packages]

    if: ${{ inputs.x64 }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x64
          key: ccache-x64
          restore-keys: |
            ccache-x64

      - name: Build x64 initrd
        run: ./build.sh --install-dep -nfa x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x64
          path: fssourcex64/buildrootx64.log
          retention-days: 30

  release:
    needs:
      [
        input_checks,
        download_filesystem_packages,
        build_kernel_arm64,
        build_kernel_x86,
        build_kernel_x64,
        build_initrd_arm64,
        build_initrd_x86,
        build_initrd_x64,
      ]

    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pxeos-beta-release
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-files-*
          merge-multiple: true
          path: distribution-files

      - name: Set release and tag names
        run: |
          release_stamp=$(TZ=Asia/Shanghai date '+%y%m%d-%H%M')
          echo "RELEASE_NAME=Beta-${release_stamp}" >> "$GITHUB_ENV"
          echo "TAG_NAME=Beta-${release_stamp}" >> "$GITHUB_ENV"

      - name: Get versions from build.sh
        run: |
          echo "LINUX_KERNEL_VER=$(sed -n -e 's/^.*KERNEL_VERSION=//p' build.sh | cut -d\' -f 2)" >> "$GITHUB_ENV"
          echo "BUILDROOT_VER=$(sed -n -e 's/^.*BUILDROOT_VERSION=//p' build.sh | cut -d\' -f 2)" >> "$GITHUB_ENV"

      - name: Validate historical release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo 'Invalid GitHub run marker.' >&2; exit 1; }
          fallback_tag="${TAG_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TAG_NAME=$(bash scripts/check-release-tag.sh --repo "$GITHUB_REPOSITORY" --tag "$TAG_NAME" --fallback-tag "$fallback_tag")
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"

      - name: Generate beta download manifest
        env:
          RELEASE_TAG: ${{ env.TAG_NAME }}
        run: |
          python3 scripts/generate-pxeos-manifest.py --input-dir distribution-files --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --download-channel beta --output distribution-files/pxeos.json

      - name: Run final sha256 checksum
        run: |
          cd distribution-files
          sha256sum -c ./*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body: |
            PXEOS beta release.
            Back up existing boot files before use.
            - Linux kernel: ${{ env.LINUX_KERNEL_VER }}
            - Buildroot: ${{ env.BUILDROOT_VER }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          files: |
            distribution-files/*

      - name: Publish beta download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-channel.sh \
            --repo "$GITHUB_REPOSITORY" \
            --channel beta \
            --target "$GITHUB_SHA" \
            --manifest distribution-files/pxeos.json \
            --resource-dir distribution-files
