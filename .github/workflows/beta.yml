name: Build Beta

on:
  workflow_dispatch:
    inputs:
      server_version:
        type: string
        required: true
        description: "要求完全一致的 RootPXE 服务端版本（例如 1.0.1）"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release_metadata:
    runs-on: ubuntu-24.04
    outputs:
      release_name: ${{ steps.naming.outputs.release_name }}
      tag_name: ${{ steps.naming.outputs.tag_name }}
      server_version: ${{ steps.naming.outputs.server_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Select canonical release metadata
        id: naming
        env:
          GH_TOKEN: ${{ github.token }}
          PXEOS_REQUIRED_SERVER_VERSION: ${{ inputs.server_version }}
        run: |
          set -euo pipefail
          source ./build_version.sh
          rootpxe_build_validate_server_version "$PXEOS_REQUIRED_SERVER_VERSION"
          printf 'server_version=%s\n' "$PXEOS_REQUIRED_SERVER_VERSION" >> "$GITHUB_OUTPUT"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]] || { echo 'Invalid GitHub run marker.' >&2; exit 1; }
          release_stamp=$(TZ=Asia/Shanghai date '+%y%m%d-%H%M')
          release_name="Beta-${release_stamp}"
          fallback_tag="${release_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rootpxe_build_validate_version "$release_name"
          rootpxe_build_validate_version "$fallback_tag"
          tag_name=$(bash scripts/check-release-tag.sh --repo "$GITHUB_REPOSITORY" --tag "$release_name" --fallback-tag "$fallback_tag")
          rootpxe_build_validate_version "$tag_name"
          printf 'release_name=%s\ntag_name=%s\n' "$release_name" "$tag_name" >> "$GITHUB_OUTPUT"

  download_filesystem_packages:
    needs: release_metadata

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Download all FS packages
        run: ./build.sh -i --fs-download-only

  build_kernel_arm64:
    needs: release_metadata

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build arm64 kernel
        run: ./build.sh --install-dep -nka arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-arm64
          path: dist
          retention-days: 1

  build_kernel_x86:
    needs: release_metadata

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x86 kernel
        run: ./build.sh --install-dep -nka x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x86
          path: dist
          retention-days: 1

  build_kernel_x64:
    needs: release_metadata

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build x64 kernel
        run: ./build.sh --install-dep -nka x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-kernel-x64
          path: dist
          retention-days: 1

  build_initrd_arm64:
    needs: [release_metadata, download_filesystem_packages]

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-arm64
          key: ccache-arm64
          restore-keys: |
            ccache-arm64

      - name: Build arm64 initrd
        run: ./build.sh --install-dep -nfa arm64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-arm64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-arm64
          path: fssourcearm64/buildrootarm64.log
          retention-days: 30

  build_initrd_x86:
    needs: [release_metadata, download_filesystem_packages]

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x86
          key: ccache-x86
          restore-keys: |
            ccache-x86

      - name: Build x86 initrd
        run: ./build.sh --install-dep -nfa x86

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x86
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x86
          path: fssourcex86/buildrootx86.log
          retention-days: 30

  build_initrd_x64:
    needs: [release_metadata, download_filesystem_packages]

    runs-on: ubuntu-24.04
    env:
      PXEOS_BUILD_VERSION: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Restore Buildroot DL cache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-dl
          key: buildroot-dl-${{ hashFiles('build.sh', 'download_helpers.sh', 'configs/**', 'Buildroot/package/**') }}
          restore-keys: |
            buildroot-dl-

      - name: Restore Buildroot CCache
        uses: actions/cache@v5
        with:
          path: ~/.buildroot-ccache-x64
          key: ccache-x64
          restore-keys: |
            ccache-x64

      - name: Build x64 initrd
        run: ./build.sh --install-dep -nfa x64

      - name: Run sha256 checksum
        run: |
          cd dist
          sha256sum -c ./*.sha256

      - name: Save distribution files
        uses: actions/upload-artifact@v7
        with:
          name: distribution-files-initrd-x64
          path: dist
          retention-days: 1

      - name: Save log file
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Buildroot-logs-x64
          path: fssourcex64/buildrootx64.log
          retention-days: 30

  release:
    needs:
      [
        release_metadata,
        download_filesystem_packages,
        build_kernel_arm64,
        build_kernel_x86,
        build_kernel_x64,
        build_initrd_arm64,
        build_initrd_x86,
        build_initrd_x64,
      ]

    runs-on: ubuntu-24.04
    env:
      RELEASE_NAME: ${{ needs.release_metadata.outputs.release_name }}
      TAG_NAME: ${{ needs.release_metadata.outputs.tag_name }}
      PXEOS_REQUIRED_SERVER_VERSION: ${{ needs.release_metadata.outputs.server_version }}
    permissions:
      contents: write
    concurrency:
      group: pxeos-beta-release
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download distribution files
        uses: actions/download-artifact@v8
        with:
          pattern: distribution-files-*
          merge-multiple: true
          path: distribution-files

      - name: Get versions from build.sh
        run: |
          echo "LINUX_KERNEL_VER=$(sed -n -e 's/^.*KERNEL_VERSION=//p' build.sh | cut -d\' -f 2)" >> "$GITHUB_ENV"
          echo "BUILDROOT_VER=$(sed -n -e 's/^.*BUILDROOT_VERSION=//p' build.sh | cut -d\' -f 2)" >> "$GITHUB_ENV"

      - name: Generate beta historical download manifest
        env:
          RELEASE_TAG: ${{ env.TAG_NAME }}
        run: |
          python3 scripts/generate-pxeos-manifest.py --input-dir distribution-files --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --required-server-version "$PXEOS_REQUIRED_SERVER_VERSION" --output distribution-files/pxeos.json --require-all

      - name: Run final sha256 checksum
        run: |
          cd distribution-files
          sha256sum -c ./*.sha256

      - name: Validate historical release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source ./build_version.sh
          rootpxe_build_validate_version "$TAG_NAME"
          [[ $TAG_NAME == Beta-* ]] || exit 1
          bash scripts/check-release-tag.sh --repo "$GITHUB_REPOSITORY" --tag "$TAG_NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ env.RELEASE_NAME }}
          body: |
            PXEOS beta release.
            Back up existing boot files before use.
            - 内核版本（PXEOS）：${{ env.TAG_NAME }}
            - 对应服务端版本：${{ env.PXEOS_REQUIRED_SERVER_VERSION }}（必须完全一致）
            - Linux kernel: ${{ env.LINUX_KERNEL_VER }}
            - Buildroot: ${{ env.BUILDROOT_VER }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: 'false'
          files: |
            distribution-files/*

      - name: Generate beta channel download manifest
        env:
          RELEASE_TAG: ${{ env.TAG_NAME }}
        run: |
          mkdir -p channel-files
          python3 scripts/generate-pxeos-manifest.py --input-dir distribution-files --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --download-channel beta --required-server-version "$PXEOS_REQUIRED_SERVER_VERSION" --output channel-files/pxeos.json --require-all

      - name: Publish beta download manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/publish-channel.sh \
            --repo "$GITHUB_REPOSITORY" \
            --channel beta \
            --target "$GITHUB_SHA" \
            --manifest channel-files/pxeos.json \
            --resource-dir distribution-files
